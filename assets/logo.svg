<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Deep-Viz">
  <defs>
    <linearGradient id="dv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#108EE9"/>
      <stop offset="1" stop-color="#0BBEFE"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#dv-bg)"/>

  <!-- three bars, rising -->
  <rect x="26" y="70" width="16" height="30" rx="4" fill="#fff" fill-opacity=".55"/>
  <rect x="50" y="54" width="16" height="46" rx="4" fill="#fff" fill-opacity=".75"/>
  <rect x="74" y="34" width="16" height="66" rx="4" fill="#fff" fill-opacity=".95"/>

  <!-- trend line over the bars, with a marker at its peak -->
  <path d="M28 62 L58 46 L82 26" stroke="#2CA51A" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="82" cy="26" r="7" fill="#2CA51A" stroke="#fff" stroke-width="3"/>
</svg>
